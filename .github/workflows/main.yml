name: Build BD-J

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Compile
        run: |
          mkdir -p out
          find 00000 -name "*.java" > sources.txt
          javac -source 1.4 -target 1.4 \
            -classpath "00000/org/bdj/rt.jar:00000/org/bdj/bdjstack.jar" \
            -d out @sources.txt

      - name: Downgrade ke 1.3
        run: |
          python3 << 'EOF'
          import os, struct
          def downgrade(data):
              if data[:4] != b'\xca\xfe\xba\xbe': return data
              if struct.unpack('>H', data[6:8])[0] == 48:
                  data = bytearray(data); data[7] = 47
                  return bytes(data)
              return data
          for r,d,files in os.walk('out'):
              for f in files:
                  p = os.path.join(r,f)
                  with open(p,'rb') as x: b = x.read()
                  if f.endswith('.class'): b = downgrade(b)
                  with open(p,'wb') as x: x.write(b)
          print("Done")
          EOF

      - name: Package JAR
        run: |
          cp 00000/org/bdj/rt.jar out/org/bdj/
          cp 00000/org/bdj/bdjstack.jar out/org/bdj/
          cp 00000/org/bdj/bluray.InitXlet.perm out/org/bdj/
          printf 'Manifest-Version: 1.0\nMIDlet-1: InitXlet,,org.bdj.InitXlet\n' > mf.mf
          mkdir -p dist
          cd out && jar cfm ../dist/00000.jar ../mf.mf . && cd ..

      - name: Generate Certificate
        run: |
          openssl genrsa -out private.pem 1024
          openssl req -new -x509 \
            -key private.pem \
            -out app.discroot.crt \
            -days 36500 -sha1 \
            -subj "/CN=Studio/OU=Codesigning Department/O=BDJCompany.56789abc/C=US"
          openssl x509 -in app.discroot.crt -out app.discroot.der -outform DER

      - name: Sign JAR
        run: |
          openssl pkcs12 -export \
            -in app.discroot.crt -inkey private.pem \
            -out bdj.p12 -name "SIG-BD00" -passout pass:bdj12345
          keytool -importkeystore \
            -srckeystore bdj.p12 -srcstoretype PKCS12 -srcstorepass bdj12345 \
            -destkeystore bdj.jks -deststorepass bdj12345 -noprompt
          jarsigner -keystore bdj.jks -storepass bdj12345 \
            -sigfile SIG-BD00 -digestalg SHA1 -sigalg SHA1withRSA \
            dist/00000.jar SIG-BD00
          echo "✅ Signed OK"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bdj-build
          path: |
            dist/00000.jar
            app.discroot.crt
            app.discroot.der
